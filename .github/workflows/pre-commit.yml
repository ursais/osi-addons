name: Pre-Commit

on:
  pull_request:
    branches:
      - "19.0*"
  push:
    branches:
      - "19.0"
      - "19.0-ocabot-*"

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1
