name: Publish to PyPI

on:
  push:
    branches:
      - "19.0"
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      addon:
        description: "Addon directory to publish (empty = all changed, or all on release)"
        required: false
        type: string

jobs:
  discover:
    name: Discover addons to publish
    runs-on: ubuntu-latest
    outputs:
      addons: ${{ steps.set-matrix.outputs.addons }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: set-matrix
        name: Resolve addon list
        shell: bash
        run: |
          set -euo pipefail
          chmod +x .github/scripts/changed_addons.sh

          if [ -n "${{ inputs.addon }}" ]; then
            addons="$(printf '%s\n' "${{ inputs.addon }}" | jq -R -s -c 'split("\n") | map(select(length > 0))')"
          elif [ "${{ github.event_name }}" = "push" ]; then
            addons="$(
              .github/scripts/changed_addons.sh "${{ github.event.before }}" "${{ github.sha }}" \
                | jq -R -s -c 'split("\n") | map(select(length > 0))'
            )"
          else
            # release or dispatch without addon: publish every packaged addon
            addons="$(
              .github/scripts/changed_addons.sh \
                | jq -R -s -c 'split("\n") | map(select(length > 0))'
            )"
          fi

          echo "addons=${addons}" >> "${GITHUB_OUTPUT}"
          echo "Addons to publish: ${addons}"

  publish:
    name: Publish ${{ matrix.addon }}
    needs: discover
    if: needs.discover.outputs.addons != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        addon: ${{ fromJson(needs.discover.outputs.addons) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build
        run: python -m pip install --upgrade pip build
      - name: Build ${{ matrix.addon }}
        env:
          WHOOL_POST_VERSION_STRATEGY_OVERRIDE: none
        run: |
          mkdir -p dist
          python -m build --outdir dist "${{ matrix.addon }}"
          ls -l dist
      - name: Publish ${{ matrix.addon }} to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
