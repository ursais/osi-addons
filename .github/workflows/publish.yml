name: Publish to PyPI

on:
  push:
    branches:
      - "19.0"
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  discover:
    name: Discover addon packages
    runs-on: ubuntu-latest
    outputs:
      addons: ${{ steps.set-matrix.outputs.addons }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: set-matrix
        name: List addons with pyproject.toml
        run: |
          addons="$(
            find . -mindepth 2 -maxdepth 2 -name pyproject.toml -printf '%h\n' \
              | sed 's|^\./||' \
              | sort \
              | jq -R -s -c 'split("\n") | map(select(length > 0))'
          )"
          echo "addons=${addons}" >> "${GITHUB_OUTPUT}"
          echo "Found addons: ${addons}"

  publish:
    name: Publish ${{ matrix.addon }}
    needs: discover
    if: needs.discover.outputs.addons != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        addon: ${{ fromJson(needs.discover.outputs.addons) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build
        run: python -m pip install --upgrade pip build
      - name: Build ${{ matrix.addon }}
        env:
          # Publish the exact manifest version (no .postN git suffix).
          WHOOL_POST_VERSION_STRATEGY_OVERRIDE: none
        run: |
          mkdir -p dist
          python -m build --outdir dist "${{ matrix.addon }}"
          ls -l dist
      - name: Publish ${{ matrix.addon }} to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
